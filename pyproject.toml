[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "openstory-studio"
version = "0.1.0"
description = "Local-first, model-agnostic narrative production state."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pillow>=11,<13",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.9,<1",
  "types-Pillow>=10.2",
]

[tool.hatch.build.targets.wheel]
packages = [
  "packages/openstory",
  "apps/api/openstory_api",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["packages", "apps/api"]
asyncio_mode = "auto"
markers = [
  "local_ai: requires explicitly configured local model runtimes",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["packages/openstory", "apps/api/openstory_api"]
mypy_path = ["packages", "apps/api"]
